name: security

# Runs on every push and pull request, including from forks. A fork that accidentally
# commits a session cookie gets told before it is merged here.
#
# Linux only, on purpose: verify-ignores.sh is bash and gitleaks-action is a container.
# Building and testing across operating systems is ci.yml's job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Full history: a secret committed then "removed" is still there.
      - name: Verify .gitignore actually blocks credentials
        run: ./scripts/verify-ignores.sh
      - name: Scan for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Same pnpm setup as ci.yml, so the two workflows cannot drift apart.
      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=moderate
