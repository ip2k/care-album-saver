name: security

# Runs on every push and pull request, including from forks. A fork that accidentally
# commits a session cookie gets told before it is merged here.
#
# Linux only, on purpose: verify-ignores.sh is bash and gitleaks-action is a container.
# Building and testing across operating systems is ci.yml's job.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Full history: a secret committed then "removed" is still there.
          # Nothing after this fetches: gitleaks reads the local history, and the token it
          # is handed below goes to the API, not to git. So none is left in .git/config for
          # a pull request's own scripts/verify-ignores.sh to find.
          persist-credentials: false
      - name: Verify .gitignore actually blocks credentials
        run: ./scripts/verify-ignores.sh
      - name: Scan for credentials
        # v3, not v2: v2 runs on GitHub's node20 action runtime, which is being retired —
        # the job would go red for its runtime rather than for anything it found.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Without a token the action's calls to the pull-request API are unauthenticated
          # and rate-limited from a shared runner address. The findings still reach the job
          # summary either way; this only stops an unrelated failure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Same pnpm setup as ci.yml, so the two workflows cannot drift apart.
      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=moderate
