name: ci

# Runs on every push to main and on every pull request, including from forks — the same
# trigger as security.yml, for the same reason: a change is shown working before it is
# merged, not after a parent installs it. The matrix is the one place a Windows path, and
# the oldest Node the package supports (engines: >=22), are sure to be exercised: no
# developer machine on this project is Windows, and none is held to the oldest Node.
#
# `pull_request` and never `pull_request_target`: a fork's run gets a read-only token and
# no repository secrets, and that is what makes running a stranger's code here safe.
on:
  push:
    branches: [main]
  pull_request:

# Read the repository, nothing else. No job here writes to it, comments, releases or
# publishes a page, and none names a secret.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must not cancel the others: "fails only on Windows with Node 22" is
      # the whole diagnosis, and fail-fast would hide it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          # The token is not left in .git/config, where the code under test could read it.
          persist-credentials: false
      # pnpm comes from its own action rather than `corepack enable`: Node 25 stopped
      # bundling corepack, so on the 26 cells that step would find nothing to enable.
      #
      # The exact version, the same in every workflow and in the Dockerfile
      # (test/workflows.test.js keeps them equal; security review sc-6). Not from a
      # `packageManager` field in package.json: pnpm 12 turns that field into a
      # packageManagerDependencies entry in pnpm-lock.yaml, and --frozen-lockfile refuses to
      # install until the lockfile carries one, so adding it is a lockfile change of its own.
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      # As a parent's clone installs (the README's `pnpm install`), so the matrix tests what
      # they get, the optional ExifTool included; frozen, so a pull request cannot change a
      # dependency without changing the lockfile where a reviewer sees it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: The CLI entry point starts on this platform
        # `where` resolves four paths and prints them; no network, nothing written. It proves
        # the shebang-headed dist/cli.js loads under this Node and OS and that the config
        # directory resolves per platform — APPDATA on Windows, not a POSIX guess.
        run: node packages/care-album-saver/dist/cli.js where
        env:
          CARE_ALBUM_CONFIG_DIR: ${{ runner.temp }}/bw-config

  # On a fork's pull request this runs the fork's own scripts/screenshots.js and uploads the
  # pictures it wrote, which is safe because nothing can come of it (security review sc-3):
  #
  # - The token can only read, and is not on disk: the job's own permissions say
  #   `contents: read` (so a later widening of the workflow's does not reach it), and the
  #   checkout does not persist it. No secret is named, so a fork's run has none to find.
  # - The upload is a workflow artifact, attached to that run and deleted after 7 days.
  #   Nothing downloads it, commits it or publishes it: there is no `workflow_run` workflow
  #   in this repository, and docs/images changes only when a person runs
  #   `node scripts/screenshots.js` and commits what they have looked at. A fork can make
  #   the artifact contain anything; it is a picture for a reviewer, not an input.
  # - The pnpm cache a pull request writes is scoped to that pull request's ref, so a run on
  #   main can never restore it.
  screenshots:
    name: guide screenshots still capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.5.1
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The same install as the test job's.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The only network use here is fetching Chromium. The script itself drives the
      # built-in mock, so a captured image can only ever show Robin and Sam Maple.
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/screenshots.js
      - uses: actions/upload-artifact@v4
        with:
          name: guide-screenshots
          path: docs/images/*.png
          retention-days: 7
