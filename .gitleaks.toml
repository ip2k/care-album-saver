# Secret scanning for this repository.
#
# Run locally:  gitleaks detect --config .gitleaks.toml
# Runs in CI on every pull request (see .github/workflows/security.yml).
#
# The built-in rules catch AWS keys, tokens and the like. The rules below add the
# credentials that are specific to this project — a generic scanner has no idea what
# a Brightwheel session looks like.

title = "care-album-saver"

[extend]
useDefault = true

[[rules]]
id = "brightwheel-session-cookie"
description = "Brightwheel session cookie (_brightwheel_v2) — grants full access to a family's account"
regex = '''_brightwheel_v2\s*[=:]\s*["']?[A-Za-z0-9%._\-+/]{20,}'''
tags = ["cookie", "session", "brightwheel"]

[[rules]]
id = "brightwheel-session-json"
description = "A saved session.json payload"
regex = '''"cookie"\s*:\s*"[A-Za-z0-9%._\-+/]{20,}"'''
tags = ["session"]

[[rules]]
id = "signed-media-url"
description = "Signed CDN media URL — a bearer credential for one child's photo"
regex = '''https?://[^\s"']+[?&](?:signature|X-Amz-Signature|X-Goog-Signature)=[A-Za-z0-9%._\-+/]{16,}'''
tags = ["url", "media"]

[allowlist]
# Values, never paths.
#
# This used to exempt `packages/.*/test/.*` and the mock server wholesale, which meant the
# two rules above — the ones that exist because a generic scanner cannot recognise a
# Brightwheel session — were switched off across the whole test tree. The test tree is
# exactly where a real session gets pasted: somebody debugging a failing test swaps the
# invented cookie for their own for five minutes and commits it, and the scanner that was
# added to catch that says nothing.
#
# So each invented literal is listed instead. Adding a test that needs a new synthetic
# credential means adding its value here, which is a line a reviewer can see and question.
# Never add a path back.
description = "The synthetic credentials the tests and the mock server invent"
regexes = [
  # The mock server's session, and what every test passes as `validSession`.
  '''test-session-value''',
  # The Secret class's own tests, which must print a value to prove it is not printed.
  '''super-secret-cookie-value''',
  # Deliberately unreal signatures in the URL-identity and scrubbing tests. The word
  # boundary matters: a bare `signature=x` would also allowlist a real signature that
  # happens to start with an x.
  '''signature=(aaa|zzz|deadbeef|x)\b''',
  # The verify-report fixture, which needs a signature long enough to look like one.
  '''signature=not-a-real-signature''',
  # The paste-shape tests, which need values long enough to look like a session.
  '''NotARealSession''',
]
